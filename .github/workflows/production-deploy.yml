name: Production Deploy

# session188 (২০২৬-০৯-২১): রিপো-প্রাইভেট-হওয়ার-পর Vercel-GitHub-ইন্টিগ্রেশনের
# অটো-ডিপ্লয় আর ট্রিগার-হচ্ছিল-না (push-এর-পর ২০+ মিনিটে-ও-নীরব)। এই-ওয়ার্কফ্লো
# VERCEL_TOKEN-সিক্রেট দিয়ে CLI-আপলোড-ডিপ্লয়-করে — গিট-ইন্টিগ্রেশন-স্বাধীন,
# প্রাইভেট-রিপো-নির্ভরযোগ্য-পথ। প্রতিটি push-এ (lekhok-forum/** বদলালে) + ম্যানুয়ালি।
#
# ম্যানুয়ালি: GitHub → Actions → Production Deploy → Run workflow
# টোকেন-কেবল-secrets-এ — ফাইলে-কখনো-নয় (নিরাপত্তা-নীতি)।
# v2: /v2/user-এ 'uid'-কী-আর-নেই → orgId-আবিষ্কার-বাদ; `vercel link --project`
# নিজেই scope-resolve-করে (.vercel/project.json তৈরি-করে)।

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'lekhok-forum/**'
      - '.github/workflows/production-deploy.yml'

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Vercel প্রোডাকশন-ডিপ্লয়
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: রিপো চেকআউট
        uses: actions/checkout@v4

      - name: Node 20 সেটআপ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: টোকেন↔প্রজেক্ট-যাচাই
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          HTTP=$(curl -sf -o /tmp/proj.json -w '%{http_code}' "https://api.vercel.com/v9/projects/prj_K93Nw5Fl4xngOclbPCXdlOVqLbC4" -H "Authorization: Bearer $VERCEL_TOKEN" || echo 000)
          if [ "$HTTP" != "200" ]; then echo "❌ VERCEL_TOKEN দিয়ে প্রজেক্ট prj_K93Nw5Fl4xngOclbPCXdlOVqLbC4 পাওয়া যায়নি (HTTP $HTTP) — সিক্রেট-আপডেট-দরকার"; exit 1; fi
          NAME=$(python3 -c "import json;print(json.load(open('/tmp/proj.json')).get('name',''))")
          echo "✓ প্রজেক্ট: $NAME (prj_K93Nw5Fl4xngOclbPCXdlOVqLbC4)"

      - name: প্রজেক্ট-লিংক (vercel link)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          NAME=$(python3 -c "import json;print(json.load(open('/tmp/proj.json')).get('name',''))")
          cd lekhok-forum
          npx --yes vercel@latest link --yes --project "$NAME" --token "$VERCEL_TOKEN"

      - name: প্রোডাকশন-ডিপ্লয় (gitSource-API → ব্যর্থ-হলে CLI-fallback)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          NAME=$(curl -sf "https://api.vercel.com/v9/projects/prj_K93Nw5Fl4xngOclbPCXdlOVqLbC4" -H "Authorization: Bearer $VERCEL_TOKEN" | python3 -c "import sys,json;print(json.load(sys.stdin)['name'])")
          echo "প্রজেক্ট-নাম: $NAME"
          HTTP=$(curl -s -o /tmp/dep.json -w '%{http_code}' -X POST "https://api.vercel.com/v13/deployments?skipAutoDetectionChanged=1" \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            -d "{\"name\":\"$NAME\",\"target\":\"production\",\"gitSource\":{\"type\":\"github\",\"repoId\":1354883101,\"ref\":\"main\"}}" || echo 000)
          echo "gitSource-HTTP=$HTTP"
          head -c 500 /tmp/dep.json 2>/dev/null || true; echo
          DEP_ID=$(python3 -c "import json;print(json.load(open('/tmp/dep.json')).get('id',''))" 2>/dev/null || echo "")
          if [ -n "$DEP_ID" ]; then
            echo "ডিপ্লয়মেন্ট: $DEP_ID"
            for i in $(seq 1 60); do
              sleep 20
              STATE=$(curl -s "https://api.vercel.com/v13/deployments/$DEP_ID" -H "Authorization: Bearer $VERCEL_TOKEN" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('readyState') or d.get('state') or 'UNKNOWN')")
              echo "  poll$i: $STATE"
              case "$STATE" in
                READY) echo "✅ প্রোডাকশন-ডিপ্লয় READY"; exit 0;;
                ERROR|CANCELED) echo "⚠️ gitSource-ডিপ্লয়-ব্যর্থ ($STATE) — CLI-fallback-এ-যাওয়া-হচ্ছে"; break;;
              esac
            done
          fi
          echo "▶️ CLI-fallback ডিপ্লয়…"
          cd lekhok-forum
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" --archive=tgz
