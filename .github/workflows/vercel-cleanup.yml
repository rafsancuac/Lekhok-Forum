name: Vercel Deployment Cleanup

# প্রতিদিন রাত ১২:০০ (ঢাকা, UTC+৬) = ১৮:০০ UTC — পুরনো ডিপ্লয়মেন্ট পরিষ্কার।
# কেন: প্রতিটি ডিপ্লয়মেন্টের ফাংশন-বান্ডেল Vercel-এ জমা হয়; Functions Storage
# সীমা (Hobby: ১০ GB) পার হলে অ্যাকাউন্ট অবরুদ্ধ হতে পারে।
# বিস্তারিত: lekhok-forum/VERCEL-CLEANUP.md
#
# ম্যানুয়ালি চালাতে: GitHub → Actions ট্যাব → এই ওয়ার্কফ্লো → Run workflow
# ⚠️ নোট: রিপো ৬০ দিন নিষ্ক্রিয় থাকলে GitHub নিজেই সি-ডিউল-ওয়ার্কফ্লো বন্ধ করে দেয়।

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      keep:
        description: 'সর্বশেষ কতটি ডিপ্লয়মেন্ট রাখা হবে'
        required: false
        default: '5'

permissions: {}

jobs:
  cleanup:
    name: পুরনো ডিপ্লয়মেন্ট ডিলিট (শেষ ৫ রেখে)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: রিপো চেকআউট
        uses: actions/checkout@v4

      - name: Node 20 সেটআপ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ক্লিনআপ-স্ক্রিপ্ট চালু
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          KEEP_COUNT: ${{ github.event.inputs.keep || '5' }}
        run: node lekhok-forum/scripts/cleanup-vercel-deployments.mjs
