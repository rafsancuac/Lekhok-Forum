<!DOCTYPE html>
<html lang="bn" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অফলাইন — লেখক ফোরাম</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/icon-192.png">
<style>
  :root { --navy:#0F2A4A; --green:#065F46; --muted:#5B6B7C; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:linear-gradient(180deg,#ffffff 0%,#f0fdf7 55%,#e6f7ef 100%);
    color:#1e293b; text-align:center; padding:24px;
  }
  .card {
    max-width:420px; width:100%; background:#fff; border:1px solid #e2e8f0;
    border-radius:16px; padding:36px 28px; box-shadow:0 8px 30px rgba(6,95,70,.08);
  }
  .badge {
    width:72px; height:72px; margin:0 auto 18px; border-radius:50%;
    background:#e6f6ef; display:flex; align-items:center; justify-content:center;
  }
  .badge svg { width:38px; height:38px; }
  h1 { font-size:1.45rem; color:var(--navy); margin-bottom:8px; }
  p  { font-size:.95rem; color:var(--muted); line-height:1.7; margin-bottom:6px; }
  .hint { font-size:.8rem; margin:14px 0 22px; }
  .dot { color:#d97706; font-weight:600; }
  a.btn {
    display:inline-flex; align-items:center; gap:8px; text-decoration:none;
    background:var(--green); color:#fff; font-weight:600; font-size:.95rem;
    padding:12px 26px; border-radius:10px; transition:background .15s;
  }
  a.btn:hover { background:#047857; }
  a.btn:active { transform:translateY(1px); }
  footer { margin-top:26px; font-size:.75rem; color:#94a3b8; }
</style>
</head>
<body>
  <main class="card">
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#065F46" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3a7 7 0 0 0-7 7v4a2 2 0 0 0 2 2h1v-6H6.5A5.5 5.5 0 0 1 12 5a5.5 5.5 0 0 1 5.5 5H16v6h1a2 2 0 0 0 2-2v-4a7 7 0 0 0-7-7z"/>
        <path d="M4 16.5V18a2 2 0 0 0 2 2h1"/>
      </svg>
    </div>
    <h1>ইন্টারনেট-সংযোগ নেই</h1>
    <p>আপনি এখন অফলাইনে আছেন। সংযোগ ফিরলে লেখক ফোরামের সব লেখা, আলোচনা ও কুইজ আবার ঠিক আগের মতোই চলবে।</p>
    <p class="hint"><span class="dot">●</span> আগে পড়া পাতাগুলো অফলাইনেও খোলা যেতে পারে।</p>
    <a class="btn" href="/" id="retry">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      আবার চেষ্টা করুন
    </a>
  </main>
  <footer>লেখক ফোরাম, চট্টগ্রাম বিশ্ববিদ্যালয়</footer>
  <script>
    // সংযোগ ফিরলে স্বয়ংক্রিয়ভাবে হোমে ফেরানো
    window.addEventListener('online', function () { location.href = '/'; });
  </script>
</body>
</html>
